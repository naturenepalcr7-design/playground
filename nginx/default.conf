# =====================================================================
# Nginx Reverse Proxy — KMC-GIS-SERVER
# Hardened security headers, SSL/TLS termination, rate limiting, upstream routing
# =====================================================================

# --- Rate Limiting Zones ---
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# --- Docker Embedded DNS Resolver (dynamic host resolution) ---
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Preserve incoming scheme from Cloudflare Tunnel / SSL termination ---
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# --- Only send HSTS over HTTPS / SSL termination ---
map $forwarded_proto $hsts_header {
    https "max-age=31536000; includeSubDomains";
    default "";
}

# =====================================================================
# 1. HTTP Server (Port 80) — Health Check & Automatic HTTPS Redirect
# =====================================================================
server {
    listen 80;
    server_name _;

    # Health check endpoint for Docker container liveness probe
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Redirect all other HTTP traffic to HTTPS securely
    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================================
# 2. HTTPS Server (Port 443) — Secure WebGIS Ingress (Enables GPS)
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- SSL / TLS Certificates ---
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Target endpoints for dynamic Docker DNS resolution ---
    set $backend_target http://backend:8000;
    set $frontend_target http://frontend:3000;
    set $tileserver_target http://tileserver:8080;

    # --- Global Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: http: https: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.openstreetmap.org https://server.arcgisonline.com https://*.arcgisonline.com https://services.arcgisonline.com https://mt0.google.com https://mt1.google.com https://mt2.google.com https://mt3.google.com https://*.google.com; connect-src 'self' ws: wss: http: https: data: blob:; frame-ancestors 'self';" always;

    # --- Connection Limits ---
    limit_conn conn_limit 100;

    # --- Large Upload Support (Unlimited body size for large MBTiles & spatial archives) ---
    client_max_body_size 0;
    client_body_buffer_size 128k;
    client_body_timeout 3600s;

    # --- Timeouts ---
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    # --- Health Check Endpoint ---
    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # --- Block sensitive paths & environment secrets ---
    location ~* (/\.|\.env|\.git|docker-compose|dockerfile|\.md$|\.sh$|\.yml$|\.yaml$|\.bak$) {
        deny all;
        return 404;
    }

    # ===========================================================
    # Auth API — Rate Limiting
    # ===========================================================
    location ^~ /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # ===========================================================
    # Upload Endpoints — Large Body + No Request Buffering
    # ===========================================================
    location ~ ^/api/(tiles/upload|projects/[0-9]+/tiles/upload|projects/[0-9]+/boundary/upload|media/upload|layers/upload) {
        limit_req zone=upload_limit burst=50 nodelay;

        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        # Disable buffering to stream directly to backend
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ===========================================================
    # OGC API – Features (Open + Secure)
    # ===========================================================
    location ^~ /ogc-secure {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # CORS for QGIS desktop clients
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location ^~ /ogc {
        limit_req zone=api_limit burst=100 nodelay;

        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # CORS for QGIS desktop clients
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ===========================================================
    # Backend API — Standard Rate Limiting & WebSockets
    # ===========================================================
    location ^~ /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;

        proxy_pass $backend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support for live updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Support large GeoJSON responses (e.g., 11K+ road/building features)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 16 512k;
        proxy_busy_buffers_size 1m;
    }

    # ===========================================================
    # TileServer-GL — Tile Serving
    # ===========================================================
    location ^~ /tiles/ {
        limit_req zone=api_limit burst=100 nodelay;

        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass $tileserver_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow CORS for tile requests
        add_header Access-Control-Allow-Origin "*" always;
    }

    # ===========================================================
    # Frontend — Next.js Application (catch-all)
    # ===========================================================
    location / {
        proxy_pass $frontend_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Next.js HMR / WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Static asset caching ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass $frontend_target;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
