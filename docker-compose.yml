name: kmc-gis-server

services:
  # ============================================================
  # PostgreSQL 16 + PostGIS 3.4 — Spatial Database
  # ============================================================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kmc_server_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kmc_gis}
      POSTGRES_USER: ${POSTGRES_USER:-kmc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-KmcP0stGr3s!Secure2024}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - kmc_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kmc_user} -d ${POSTGRES_DB:-kmc_gis}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis 7 — Task Locks & Session Cache
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: kmc_server_redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-KmcRedisPass!2024} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kmc_net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-KmcRedisPass!2024}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # TileServer-GL — Vector & Raster Tile Serving
  # ============================================================
  tileserver:
    build:
      context: ./tileserver
      dockerfile: Dockerfile
    container_name: kmc_server_tileserver
    restart: unless-stopped
    volumes:
      - tileserver_data:/data
    networks:
      - kmc_net
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8080/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # FastAPI Backend — REST API & Spatial Engine
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kmc_server_backend
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-kmc_gis}
      - POSTGRES_USER=${POSTGRES_USER:-kmc_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-KmcP0stGr3s!Secure2024}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-KmcRedisPass!2024}@redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-kmc-gis-server-jwt-secret-key-development-32-chars-min}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-KmcSuperUser2083}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@kmc.gov.np}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-KmcAdmin@2024!}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-KMC GIS Administrator}
      - TILESERVER_INTERNAL_URL=${TILESERVER_INTERNAL_URL:-http://tileserver:8080}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-8192}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://103.69.126.226,http://103.69.126.226:80,http://localhost,http://localhost:80,http://localhost:8090,http://127.0.0.1:8090}
      - APP_NAME=${APP_NAME:-KMC-GIS-SERVER}
      - DEBUG=${DEBUG:-false}
      - PUBLIC_SERVER_URL=${PUBLIC_SERVER_URL:-http://103.69.126.226}
      - TMPDIR=/tileserver-data/temp
    volumes:
      - tileserver_data:/tileserver-data
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ============================================================
  # Next.js Frontend — UI / Map Client
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kmc_server_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_TILE_URL=/tiles
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================
  # Nginx — Reverse Proxy & Security Ingress
  # ============================================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: kmc_server_nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      tileserver:
        condition: service_healthy
    networks:
      - kmc_net
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
    name: kmc_gis_server_pg_data
  redis_data:
    name: kmc_gis_server_redis_data
  tileserver_data:
    name: kmc_gis_server_tileserver_data
  upload_data:
    name: kmc_gis_server_upload_data

networks:
  kmc_net:
    driver: bridge
